[package]
name = "selene-backend"
version = "0.1.0"
edition = "2024"
authors = ["~VicTim~"]

[dependencies]
moonlight-bridge-server = { path = "../.deps/moonlightbridge/crates/moonlight-bridge-server" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres"] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
png = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
