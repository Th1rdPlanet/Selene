[package]
name = "selene-backend"
version = "0.1.0"
edition = "2024"
authors = ["~VicTim~"]

[dependencies]
moonlight-bridge-server = "0.5.2"
moonlight-bridge-observability = { version = "0.5.2", features = ["otlp", "prometheus"] }
prometheus = { version = "0.14", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres"] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
png = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
percent-encoding = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
