# Selene / Rust backend
# В proxy-схеме к этому адресу подключается только Velocity.
listen = "127.0.0.1:38191"
# ИМЯ переменной окружения с URL базы, а не сам URL.
# Примеры значения переменной:
# sqlite://backend/selene.db?mode=rwc
# mysql://user:password@127.0.0.1/selene
# postgres://user:password@127.0.0.1/selene
database_url_env = "SELENE_DATABASE_URL"

# PEM-файлы backend: серверный сертификат, его приватный ключ и CA,
# которым подписаны клиентские сертификаты Velocity/Paper.
certificate = "backend/tls/server.pem"
private_key = "backend/tls/server-key.pem"
client_ca = "backend/tls/frontend-ca.pem"
# true допустимо только для локального loopback smoke-test без TLS.
development_plaintext = false

# Отдельный лимит административного RPC. Он не отнимает permits у игрового входа.
admin_concurrency = 4
# Максимальный размер страницы `selene account list`; допустимо 1..50.
admin_page_size = 50

[console]
# Язык сообщений запуска: ru или en.
language = "ru"
# Показывать компактный логотип при запуске.
banner = true

[totp]
# Включает TOTP для Google Authenticator, Aegis, 2FAS и совместимых приложений.
enabled = true
# Имя переменной окружения с Base64-ключом ровно из 32 байт. Сам ключ сюда не записывается.
master_key_env = "SELENE_TOTP_MASTER_KEY"
# Название сервиса в Authenticator. Обычно показывается крупной строкой.
issuer = "Selene"
# Подпись конкретного аккаунта. {username} заменяется игровым ником.
account_label = "Minecraft • {username}"
period_seconds = 30
accepted_window = 1
setup_seconds = 300
max_attempts = 3
recovery_codes = 10
# 30 дней доверия к ранее подтверждённой паре premium-аккаунт + IP.
premium_trust_seconds = 2592000
snapshot_capacity = 4096

[policy]
# Максимум активных сессий и время жизни незавершённого входа.
session_capacity = 10000
pending_seconds = 180
# Сколько может жить завершённая сессия и выданная CAPTCHA.
authenticated_seconds = 86400
captcha_seconds = 120
# Общий предел неверных CAPTCHA/паролей в одной сессии.
max_attempts = 3
# IP попадёт в зелёный список после этого времени игры; запись живёт trust_ttl_seconds.
trust_qualify_seconds = 600
trust_ttl_seconds = 604800
# Число одновременных проверок пароля. По умолчанию — число ядер CPU; каждая проверка
# держит ~19 МиБ памяти. Раскомментируй, чтобы ограничить вручную.
# password_workers = 4
# Argon2id считает пароль в стольких полосах параллельно (1–16). Цена перебора для атакующего
# не меняется, а вход быстрее на многоядерном CPU. Старые хеши обновляются при следующем входе.
password_lanes = 4
# Ограниченная память закрытых/просроченных session id для защиты от replay.
tombstone_capacity = 20000

[telemetry]
# OpenTelemetry-трейсы каждого RPC для Grafana Tempo (OTLP/HTTP). По умолчанию выключено.
otel = false
# OTLP traces endpoint коллектора/Tempo/Grafana Alloy.
otlp_endpoint = "http://127.0.0.1:4318/v1/traces"
# service.name в Tempo; у каждого процесса должен быть свой.
service_name = "selene-backend"
# Prometheus-метрики (вход, CAPTCHA, TOTP, сессии, задержки, транспорт MoonLightBridge) для дашборда Grafana.
prometheus = false
# Адрес HTTP /metrics. Держите на loopback или закройте файрволом.
prometheus_listen = "127.0.0.1:9464"
