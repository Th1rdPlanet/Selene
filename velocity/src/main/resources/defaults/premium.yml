# Selene / Velocity — premium.yml
# Только настройки прокси. Тексты находятся в languages/<язык>.json.

# --- Проверка лицензии ------------------------------------------------------
# Для неизвестного аккаунта спросить публичный Mojang profile API.
premium-lookup-enabled: true
# Предельное ожидание Mojang API, миллисекунды.
premium-lookup-timeout-millis: 2000
# Максимум результатов проверки лицензии в памяти.
premium-lookup-cache-capacity: 10000
# Время хранения результата проверки лицензии, секунды.
premium-lookup-cache-seconds: 3600
# Максимум одновременных внешних запросов; защищает proxy thread и Mojang API.
premium-lookup-concurrency: 8

# --- Доверие к уже проверенной лицензии ------------------------------------
# Если ник и IP совпали со свежей записью backend, повторный запрос к Mojang не нужен.
# Выключено по умолчанию: при общем IP (мобильный оператор, NAT, VPN) любой с тем же
# адресом мог бы войти в лицензионный аккаунт без пароля. С false лицензия проверяется
# через Mojang при каждом входе.
premium-trust-enabled: false
# Срок доверия. Такое же значение следует указать в backend/config.toml.
premium-trust-ttl-days: 30
# Жёсткий предел записей snapshot; переполнение отключает обход до следующего снимка.
premium-trust-capacity: 10000
# Старый snapshot не используется: Selene снова выполнит обычную проверку Mojang.
premium-trust-snapshot-max-age-seconds: 120

# --- Двухфакторная аутентификация -----------------------------------------
# Сколько секунд действует защищённая сессия настройки на auth-сервере.
two-factor-management-timeout-seconds: 300
# Алиасы без /, через запятую. Секреты никогда не передаются аргументами команды.
two-factor-command-aliases: "2fa,twofactor"
