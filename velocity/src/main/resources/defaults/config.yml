# Selene / Velocity — config.yml
# Только настройки прокси. Тексты находятся в languages/<язык>.json.

# Точное имя auth-сервера из velocity.toml, секция [servers].
auth-server: "auth"
# --- Маршрутизация ----------------------------------------------------------
# Куда отправлять игрока после успешной аутентификации.
default-server: "lobby"
# true: вернуть игрока на последний игровой сервер, если он известен.
# false: всегда отправлять на default-server.
restore-last-server: true
# --- Опциональный fork API --------------------------------------------------
# Включай только если ядро/модуль предоставляет совместимый Selene ForkCapabilities.
fork-enabled: false
# --- Лимиты памяти и входов -------------------------------------------------
# Максимум одновременно отслеживаемых игровых сессий.
session-capacity: 4096
# Язык консоли и запасной язык игрока.
language-default: ru
# Выбирать язык сообщений по настройкам клиента, когда они доступны.
language-auto-detect: true
# Показывать компактный логотип при запуске.
console-banner: true
