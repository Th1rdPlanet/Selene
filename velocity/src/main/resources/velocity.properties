# Selene / Velocity
# Здесь находятся только настройки прокси. Настройки Paper-миров, эффектов и интерфейса
# задаются отдельно на auth-сервере в plugins/Selene/config.yml.

# --- Rust backend -----------------------------------------------------------
# endpoint принимает tls://host:port. tcp:// разрешён только для локальной разработки
# на loopback-адресе и только вместе с backend-allow-loopback-plaintext=true.
backend-endpoint=tls://127.0.0.1:38191
backend-allow-loopback-plaintext=false

# PKCS12 с приватным ключом ЭТОГО Velocity. Путь считается от plugins/selene/.
tls-keystore=proxy.p12
# Здесь указывается ИМЯ переменной окружения с паролем, а не сам пароль.
tls-keystore-password-env=SELENE_PROXY_KEYSTORE_PASSWORD
# PKCS12 trust store с CA/сертификатом Rust backend.
tls-truststore=trust.p12
tls-truststore-password-env=SELENE_PROXY_TRUSTSTORE_PASSWORD

# --- Связь Velocity -> Paper auth ------------------------------------------
# Локальный mTLS relay, к которому подключается Selene на auth-сервере Paper.
# Порт должен совпадать с port в plugins/Selene/relay.properties на auth-сервере.
relay-bind=127.0.0.1:38291
# Точное имя auth-сервера из velocity.toml, секция [servers].
auth-server=auth
# SHA-256 сертификата Paper auth-сервера: 64 строчные hex-цифры без двоеточий.
# Пример получения: openssl x509 -in paper-cert.pem -noout -fingerprint -sha256
auth-server-certificate-sha256=replace-with-64-character-lowercase-sha256

# --- Маршрутизация ----------------------------------------------------------
# Куда отправлять игрока после успешной аутентификации.
default-server=lobby
# true: вернуть игрока на последний игровой сервер, если он известен.
# false: всегда отправлять на default-server.
restore-last-server=true

# --- Режим защиты -----------------------------------------------------------
# Ручной нижний предел режима: NORMAL, LOW, MEDIUM или STRONG.
# NORMAL: CAPTCHA согласно normal-captcha, без лимита переподключений.
# LOW: CAPTCHA только подозрительным IP, без лимита переподключений.
# MEDIUM: CAPTCHA всем; действует per-IP ограничение входов.
# STRONG: допускаются только доверенные username+IP; premium проверяется после допуска.
attack-level=NORMAL
# Автоматически повышать режим по коротким всплескам подключений.
attack-auto=true
# Размер окна наблюдения и время спокойствия перед возвратом к нижнему режиму.
attack-window-seconds=10
attack-recovery-seconds=30
# Число новых подключений в окне для перехода LOW -> MEDIUM -> STRONG.
attack-low-connections=30
attack-medium-connections=60
attack-strong-connections=100
# IP считается подозрительным, если в одном окне превышен любой порог ниже.
suspicious-ip-connections=8
suspicious-ip-usernames=4
# Нужна ли CAPTCHA для всех в NORMAL. В LOW/MEDIUM/STRONG правила описаны выше.
normal-captcha=false

# --- Опциональный fork API --------------------------------------------------
# Включай только если ядро/модуль предоставляет совместимый Selene ForkCapabilities.
fork-enabled=false
# Зарезервировано для handshake API форка. В текущей версии true остановит запуск
# с понятной ошибкой, потому что безопасная реализация ещё не подключена.
medium-before-login=false

# --- Проверка лицензии ------------------------------------------------------
# Для неизвестного аккаунта спросить публичный Mojang profile API.
premium-lookup-enabled=true
premium-lookup-timeout-millis=2000
premium-lookup-cache-capacity=10000
premium-lookup-cache-seconds=3600
# Максимум одновременных внешних запросов; защищает proxy thread и Mojang API.
premium-lookup-concurrency=8

# --- Лимиты памяти и входов -------------------------------------------------
# Максимум одновременно отслеживаемых игровых сессий.
session-capacity=4096
# Используется при MEDIUM: не больше N входов с IP за указанное окно.
per-ip-limit=3
per-ip-window-seconds=10

# --- Сообщения игроку -------------------------------------------------------
# Значения можно полностью переводить и менять. Ключи message.* не удаляй.
message.denied=Connection denied by Selene
message.busy=Too many authentication attempts. Try again shortly.
message.strong=This address is not trusted while strong protection is active.
message.backend-unavailable=Authentication is temporarily unavailable.
message.auth-required=Authenticate before joining another server.
message.premium-lookup-unavailable=Premium account verification is temporarily unavailable.
message.session-channel-unavailable=The authentication server did not confirm a secure session.
