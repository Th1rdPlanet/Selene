# Selene / Paper
# Этот файл содержит только поведение данного Paper-сервера.
# Настройки backend, режимов атаки и маршрутизации находятся на Velocity.

# PROXY_AUTH — выделенный auth-сервер за Velocity. Используется relay.properties;
# к Rust backend обращается только Velocity.
# STANDALONE — одиночный Paper без proxy. Используется standalone.properties.
role: PROXY_AUTH

# AUTO: включить PacketEvents только в STANDALONE, где нужно скрывать реальный
# инвентарь игрока. На выделенном PROXY_AUTH инвентарь и так пустой.
# ENABLED/DISABLED: принудительно включить/выключить интеграцию.
packet-events-mode: AUTO

# Сейчас безопасно реализован AFTER_JOIN: игрок уже подключён к Paper, но полностью
# заблокирован до входа. BEFORE_JOIN требует fork handshake API и настраивается на proxy.
stage: AFTER_JOIN

# Сейчас поддерживается MAP: backend генерирует цифровую CAPTCHA, Paper показывает карту.
captcha-view: MAP

# На клиентах 1.21.8+ дополнительно показывать нативные информационные диалоги.
# Команды и CAPTCHA остаются доступны в чате; весь текст задаётся ниже.
dialogs: true

# Отключить игрока, если он не завершил CAPTCHA/вход за указанное время.
timeout-seconds: 120

# Временные эффекты действуют только пока игрок заблокирован.
effects:
  blindness: false
  darkness: false

# Видимость до успешной аутентификации.
visibility:
  hide-player-from-others: true
  hide-others-from-player: false

# Необязательная точка ожидания для STANDALONE или собственного auth-мира.
# При enabled=false игрок остаётся в точке, куда его поместил сервер.
auth-location:
  enabled: false
  world: world
  x: 0.5
  y: 100.0
  z: 0.5

# Selene не раздаёт resource pack сам. Допустимые значения:
# NONE, Oraxen, ItemsAdder. Выбранный плагин должен быть установлен на этом Paper.
resource-pack-provider: NONE

# Все сообщения Paper и весь текст диалогов поддерживают MiniMessage.
# Можно использовать теги <color>, <bold>, <font:key> и глифы вашего Oraxen/ItemsAdder pack.
# Динамические значения Selene подставляет как обычный текст, поэтому они не могут
# внедрить click/hover-теги.
messages:
  unavailable: '<red>Сервис авторизации сейчас недоступен. Попробуйте войти позже.</red>'
  timeout: '<red>Время на авторизацию истекло. Подключитесь ещё раз.</red>'
  blocked: '<yellow>Сначала завершите авторизацию.</yellow>'
  not-ready: '<yellow>Сейчас ожидается другое действие. Следуйте подсказке на экране.</yellow>'
  usage: '<yellow>Используйте <white>/login</white> или <white>/register</white>.</yellow>'
  CAPTCHA: '<aqua>Введите в чат пять цифр с карты.</aqua>'
  CAPTCHA_INVALID: '<red>Код неверный.</red> <gray>Посмотрите на карту и попробуйте снова.</gray>'
  LOGIN: '<gold>Войдите в аккаунт через <white>/login</white>.</gold>'
  REGISTER: '<gold>Создайте пароль через <white>/register</white>.</gold>'
  AUTHENTICATED: '<green>Авторизация завершена. Добро пожаловать!</green>'
  INVALID_CREDENTIALS: '<red>Неверный пароль.</red>'
  ACCOUNT_EXISTS: '<yellow>Аккаунт уже зарегистрирован. Используйте <white>/login</white>.</yellow>'
  RATE_LIMITED: '<yellow>Слишком много попыток. Немного подождите.</yellow>'
  BUSY: '<yellow>Запрос уже обрабатывается. Подождите.</yellow>'
  password-too-short: '<red>Пароль должен содержать не меньше 8 символов.</red>'
  password-too-long: '<red>Пароль должен содержать не больше 256 символов.</red>'
  password-mismatch: '<red>Пароли не совпадают.</red>'
  captcha-format: '<red>Введите ровно пять цифр с карты.</red>'
  INVALID_REQUEST: '<red>Введённые данные некорректны. Проверьте их и повторите.</red>'
  EXPIRED: '<red>Сессия авторизации истекла. Подключитесь ещё раз.</red>'
  UNAVAILABLE: '<red>Сервис авторизации временно недоступен. Повторите чуть позже.</red>'
  dialog-title: '<gradient:#8b5cf6:#38bdf8><bold>Selene</bold></gradient>'
  dialog-close: '<gray>Продолжить</gray>'
