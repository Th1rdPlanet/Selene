# Selene / Paper
# Этот файл содержит только поведение данного Paper-сервера.
# Настройки backend, режимов атаки и маршрутизации находятся на Velocity.

# PROXY_AUTH — выделенный auth-сервер за Velocity. Используется relay.properties;
# к Rust backend обращается только Velocity.
# STANDALONE — одиночный Paper без proxy. Используется standalone.properties.
role: PROXY_AUTH

# AUTO: включить PacketEvents только в STANDALONE, где нужно скрывать реальный
# инвентарь игрока. На выделенном PROXY_AUTH инвентарь и так пустой.
# ENABLED/DISABLED: принудительно включить/выключить интеграцию.
packet-events-mode: AUTO

# Сейчас безопасно реализован AFTER_JOIN: игрок уже подключён к Paper, но полностью
# заблокирован до входа. BEFORE_JOIN требует fork handshake API и настраивается на proxy.
stage: AFTER_JOIN

# Сейчас поддерживается MAP: backend генерирует цифровую CAPTCHA, Paper показывает карту.
captcha-view: MAP

# На клиентах 1.21.8+ показывать нативные диалоги с полями ввода.
dialogs: true

# Безопасный fallback использует отменённое сообщение чата. Аргументы команд
# отключены по умолчанию: посторонний плагин может увидеть command packet раньше Selene.
secure-input:
  compatibility-password-arguments: false

# Отключить игрока, если он не завершил CAPTCHA/вход за указанное время.
timeout-seconds: 120

# Временные эффекты действуют только пока игрок заблокирован.
effects:
  blindness: false
  darkness: false

# Видимость до успешной аутентификации.
visibility:
  hide-player-from-others: true
  hide-others-from-player: false

# CAPTCHA и ввод пароля всегда проходят в limbo. MANAGED создаёт пустой мир сам;
# EXISTING использует уже существующий мир и останавливает сервер при ошибке имени.
limbo:
  mode: MANAGED
  world: selene_limbo
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# --- Интерфейс авторизации --------------------------------------------------
# Каждый канал включается отдельно. Во всех текстах работает MiniMessage и
# плейсхолдер <seconds>. Состояния: connecting, captcha, login, register, processing.
# title — крупный текст по центру экрана и строка subtitle под ним.
# actionbar — строка НАД хотбаром. В Minecraft отдельного текстового "hotbar" нет.
# scoreboard — боковая панель. В каждом состоянии разрешено от 1 до 15 строк.
# experience — полоса и число уровня; они показывают оставшееся время.
presentation:
  title:
    # Показывать крупный title и subtitle во время авторизации.
    enabled: true
    # Время плавного появления title в миллисекундах.
    fade-in-millis: 0
    # Сколько title остаётся видимым. Selene обновляет его раз в секунду.
    stay-millis: 1200
    # Время плавного исчезновения title в миллисекундах.
    fade-out-millis: 200
    # Текст title/subtitle для каждого этапа. Пустая строка скрывает конкретную строку.
    states:
      connecting:
        title: '<gradient:#8b5cf6:#38bdf8><bold>SELENE</bold></gradient>'
        subtitle: '<gray>Устанавливаем защищённую сессию • <white><seconds> сек.</white></gray>'
      captcha:
        title: '<aqua><bold>ПРОВЕРКА</bold></aqua>'
        subtitle: '<white>Введите в чат цифры с карты • <seconds> сек.</white>'
      login:
        title: '<gold><bold>ВХОД</bold></gold>'
        subtitle: '<white>Используйте /login • <seconds> сек.</white>'
      register:
        title: '<green><bold>РЕГИСТРАЦИЯ</bold></green>'
        subtitle: '<white>Используйте /register • <seconds> сек.</white>'
      processing:
        title: '<yellow><bold>ПОДОЖДИТЕ</bold></yellow>'
        subtitle: '<gray>Проверяем данные • <white><seconds> сек.</white></gray>'

  actionbar:
    # Показывать строку над хотбаром.
    enabled: true
    # Формат actionbar для каждого этапа авторизации.
    states:
      connecting: '<gray>Подключение к системе авторизации...</gray> <dark_gray>•</dark_gray> <white><seconds> сек.</white>'
      captcha: '<aqua>Введите пять цифр с карты прямо в чат</aqua> <dark_gray>•</dark_gray> <white><seconds> сек.</white>'
      login: '<gold>Введите пароль через /login</gold> <dark_gray>•</dark_gray> <white><seconds> сек.</white>'
      register: '<green>Создайте пароль через /register</green> <dark_gray>•</dark_gray> <white><seconds> сек.</white>'
      processing: '<yellow>Запрос обрабатывается...</yellow> <dark_gray>•</dark_gray> <white><seconds> сек.</white>'

  scoreboard:
    # Показывать боковую панель во время авторизации.
    enabled: true
    # Заголовок и строки боковой панели для каждого этапа.
    states:
      connecting:
        title: '<gradient:#8b5cf6:#38bdf8><bold>Selene</bold></gradient>'
        lines:
          - '<white>Защищённое подключение</white>'
          - '<gray>Осталось: <seconds> сек.</gray>'
      captcha:
        title: '<aqua><bold>CAPTCHA</bold></aqua>'
        lines:
          - '<white>Посмотрите на карту</white>'
          - '<gray>Введите 5 цифр в чат</gray>'
          - '<dark_gray>Осталось: <seconds> сек.</dark_gray>'
      login:
        title: '<gold><bold>Вход</bold></gold>'
        lines:
          - '<white>Команда: /login</white>'
          - '<gray>Пароль вводится безопасно</gray>'
          - '<dark_gray>Осталось: <seconds> сек.</dark_gray>'
      register:
        title: '<green><bold>Регистрация</bold></green>'
        lines:
          - '<white>Команда: /register</white>'
          - '<gray>Минимум 8 символов</gray>'
          - '<dark_gray>Осталось: <seconds> сек.</dark_gray>'
      processing:
        title: '<yellow><bold>Selene</bold></yellow>'
        lines:
          - '<white>Проверяем данные</white>'
          - '<gray>Пожалуйста, подождите</gray>'

  experience:
    # Полоса опыта уменьшается вместе с оставшимся временем.
    bar-enabled: true
    # Число уровня показывает количество оставшихся секунд.
    level-enabled: true

# Selene не раздаёт resource pack сам. Допустимые значения:
# NONE, Oraxen, ItemsAdder. Выбранный плагин должен быть установлен на этом Paper.
resource-pack-provider: NONE

# Все сообщения Paper и весь текст диалогов поддерживают MiniMessage.
# Можно использовать теги <color>, <bold>, <font:key> и глифы вашего Oraxen/ItemsAdder pack.
# Динамические значения Selene подставляет как обычный текст, поэтому они не могут
# внедрить click/hover-теги.
messages:
  unavailable: '<red>Сервис авторизации сейчас недоступен. Попробуйте войти позже.</red>'
  timeout: '<red>Время на авторизацию истекло. Подключитесь ещё раз.</red>'
  blocked: '<yellow>Сначала завершите авторизацию.</yellow>'
  not-ready: '<yellow>Сейчас ожидается другое действие. Следуйте подсказке на экране.</yellow>'
  secure-command-only: '<red>Не вводите пароль в команде.</red> <gray>Используйте команду без аргументов — Selene откроет безопасный ввод.</gray>'
  chat-login-prompt: '<gold>Введите пароль следующим сообщением в чат.</gold> <gray>Сообщение не будет опубликовано.</gray>'
  chat-register-prompt: '<gold>Придумайте пароль и отправьте его следующим сообщением в чат.</gold> <gray>Минимум 8 символов.</gray>'
  chat-confirm-prompt: '<gold>Повторите пароль ещё одним сообщением.</gold>'
  usage: '<yellow>Используйте <white>/login</white> или <white>/register</white> без аргументов.</yellow>'
  CAPTCHA: '<aqua>Введите в чат пять цифр с карты.</aqua>'
  CAPTCHA_INVALID: '<red>Код неверный.</red> <gray>Посмотрите на карту и попробуйте снова.</gray>'
  LOGIN: '<gold>Войдите в аккаунт через <white>/login</white>.</gold>'
  REGISTER: '<gold>Создайте пароль через <white>/register</white>.</gold>'
  AUTHENTICATED: '<green>Авторизация завершена. Добро пожаловать!</green>'
  INVALID_CREDENTIALS: '<red>Неверный пароль.</red>'
  ACCOUNT_EXISTS: '<yellow>Аккаунт уже зарегистрирован. Используйте <white>/login</white>.</yellow>'
  RATE_LIMITED: '<yellow>Слишком много попыток. Немного подождите.</yellow>'
  BUSY: '<yellow>Запрос уже обрабатывается. Подождите.</yellow>'
  password-too-short: '<red>Пароль должен содержать не меньше 8 символов.</red>'
  password-too-long: '<red>Пароль должен содержать не больше 256 символов.</red>'
  password-mismatch: '<red>Пароли не совпадают.</red>'
  captcha-format: '<red>Введите ровно пять цифр с карты.</red>'
  INVALID_REQUEST: '<red>Введённые данные некорректны. Проверьте их и повторите.</red>'
  EXPIRED: '<red>Сессия авторизации истекла. Подключитесь ещё раз.</red>'
  UNAVAILABLE: '<red>Сервис авторизации временно недоступен. Повторите чуть позже.</red>'
  dialog-title: '<gradient:#8b5cf6:#38bdf8><bold>Selene</bold></gradient>'
  dialog-body: '<gray>Данные отправляются только серверу авторизации и не публикуются в чат.</gray>'
  dialog-password-label: '<white>Пароль</white>'
