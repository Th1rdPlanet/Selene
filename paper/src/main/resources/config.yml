  dialog-submit: '<green>Продолжить</green>'
  admin-console-only: '<red>Управление аккаунтами доступно только из консоли.</red>'
  admin-use-velocity: '<yellow>В режиме PROXY_AUTH выполните эту команду в консоли Velocity.</yellow>'
  admin-help: '<gray>Команды:</gray> <white>selene account list [page]</white><newline><white>selene account info <name></white><newline><white>selene account delete <name></white><newline><white>selene account reset-password <name></white>'
  admin-invalid-username: '<red>Ник должен содержать 3–16 латинских букв, цифр или _.</red>'
  admin-list-header: '<gradient:#8b5cf6:#38bdf8><bold>Selene Accounts</bold></gradient> <gray>• страница <page></gray>'
