# Selene / Paper — protection.yml
# Тексты интерфейса: languages/<язык>.json. Поддерживается MiniMessage.

# AUTO: включить PacketEvents только в STANDALONE, где нужно скрывать реальный
# инвентарь игрока. На выделенном PROXY_AUTH инвентарь и так пустой.
# ENABLED/DISABLED: принудительно включить/выключить интеграцию.
packet-events-mode: "AUTO"
# Безопасный fallback использует отменённое сообщение чата. Аргументы команд
# отключены по умолчанию: посторонний плагин может увидеть command packet раньше Selene.
secure-input:
  # Разрешить пароли в аргументах команд. Небезопасно с плагинами, записывающими команды.
  compatibility-password-arguments: false
# Время на весь процесс авторизации, в секундах (10–3600).
timeout-seconds: 120
# Временные эффекты действуют только пока игрок заблокирован.
effects:
  # Накладывать слепоту до завершения авторизации.
  blindness: false
  # Накладывать темноту до завершения авторизации.
  darkness: false
# Видимость до успешной аутентификации.
visibility:
  # Скрывать неавторизованного игрока от остальных.
  hide-player-from-others: true
  # Скрывать остальных от неавторизованного игрока.
  hide-others-from-player: false
