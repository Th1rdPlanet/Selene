# Selene / Paper — limbo.yml
# Тексты интерфейса: languages/<язык>.json. Поддерживается MiniMessage.

# CAPTCHA и ввод пароля всегда проходят в limbo. MANAGED создаёт пустой мир сам;
# EXISTING использует уже существующий мир и останавливает сервер при ошибке имени.
limbo:
  # MANAGED создаёт пустой мир; EXISTING использует уже созданный мир.
  mode: "MANAGED"
  # Имя мира авторизации.
  world: "selene_limbo"
  # Координата X точки ожидания.
  x: 0.5
  # Координата Y точки ожидания.
  y: 64.0
  # Координата Z точки ожидания.
  z: 0.5
  # Горизонтальное направление взгляда, градусы.
  yaw: 0.0
  # Вертикальное направление взгляда, градусы.
  pitch: 0.0
