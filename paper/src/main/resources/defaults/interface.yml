# Selene / Paper — interface.yml
# Тексты интерфейса: languages/<язык>.json. Поддерживается MiniMessage.

# DIALOG_FONT показывает CAPTCHA и поле для пяти цифр в одном нативном окне.
# MAP оставляет прежний вариант с картой и вводом в чат.
captcha-view: "DIALOG_FONT"
captcha:
  # Шрифт из resource pack. Готовый пакет Selene для ItemsAdder использует это имя.
  font: "selene:captcha"
  # MANUAL — пакет установлен самим игроком или внешним способом; Selene открывает
  # диалог сразу, не ожидая события загрузки от сервера.
  # SERVER — ItemsAdder/Oraxen действительно отправляет пакет при входе; Selene
  # ждёт SUCCESSFULLY_LOADED и только затем показывает глифы.
  resource-pack-loading: "MANUAL"
  # Сколько ждать загрузки resource pack перед использованием резервной карты.
  pack-load-timeout-seconds: 15
  # Показать карту, если клиент отклонил pack, загрузка не удалась или диалог недоступен.
  fallback-to-map: true
# --- Нативные диалоги -------------------------------------------------------
# Диалоги доступны в Paper API и клиентах 1.21.6+. На auth Paper они открываются
# после протокольного входа в limbo, но до первого подключения к игровому серверу.
dialogs:
  # Использовать нативные окна для ввода пароля, когда их поддерживает клиент.
  enabled: true
  # Если диалог недоступен, безопасно принять пароль следующим отменённым сообщением чата.
  fallback-to-chat: true
  # Разрешить игроку закрыть окно клавишей Escape. Команда откроет его повторно.
  can-close-with-escape: true
  # Ставить ли одиночную игру клиента на паузу. Для сервера обычно оставляют false.
  pause: false
  # Сколько секунд callback кнопки остаётся действительным после открытия окна.
  callback-lifetime-seconds: 180
  captcha:
    # Ширина текстового блока диалога.
    body-width: 320
    answer:
      # Ширина поля ответа.
      width: 220
      # Показывать подпись поля.
      label-visible: true
    button:
      # Ширина кнопки.
      width: 150
      # CONTENT — кнопка сразу под полем ввода; FOOTER — внизу экрана.
      placement: "CONTENT"
  login:
    # Максимальная ширина блока описания в пикселях.
    body-width: 320
    password:
      # Ширина поля в пикселях.
      width: 300
      # Показывать подпись над полем.
      label-visible: true
      # Максимальное число символов; backend дополнительно проверяет свой предел.
      max-length: 256
    button:
      # Ширина кнопки в пикселях.
      width: 150
      # CONTENT — кнопка сразу под полем ввода; FOOTER — внизу экрана.
      placement: "CONTENT"
  register:
    # Максимальная ширина блока описания в пикселях.
    body-width: 320
    password:
      # Ширина первого поля в пикселях.
      width: 300
      # Показывать подпись первого поля.
      label-visible: true
      # Максимальное число символов первого поля.
      max-length: 256
    confirmation:
      # Ширина поля подтверждения в пикселях.
      width: 300
      # Показывать подпись поля подтверждения.
      label-visible: true
      # Максимальное число символов подтверждения.
      max-length: 256
    button:
      # Ширина кнопки в пикселях.
      width: 180
      # CONTENT — кнопка сразу под полями ввода; FOOTER — внизу экрана.
      placement: "CONTENT"
# --- Интерфейс авторизации --------------------------------------------------
# Каждый канал включается отдельно. Во всех текстах работает MiniMessage и
# плейсхолдер <seconds>. Состояния: connecting, captcha, login, register, processing.
# title — крупный текст по центру экрана и строка subtitle под ним.
# actionbar — строка НАД хотбаром. В Minecraft отдельного текстового "hotbar" нет.
# scoreboard — боковая панель. В каждом состоянии разрешено от 1 до 15 строк.
# experience — полоса и число уровня; они показывают оставшееся время.
presentation:
  title:
    # Показывать крупный title и subtitle во время авторизации.
    enabled: true
    # Время плавного появления title в миллисекундах.
    fade-in-millis: 0
    # Сколько title остаётся видимым. Selene обновляет его раз в секунду.
    stay-millis: 1200
    # Время плавного исчезновения title в миллисекундах.
    fade-out-millis: 200
  actionbar:
    # Показывать строку над хотбаром.
    enabled: true
  scoreboard:
    # Показывать боковую панель во время авторизации.
    enabled: true
  experience:
    # Полоса опыта уменьшается вместе с оставшимся временем.
    bar-enabled: true
    # Число уровня показывает количество оставшихся секунд.
    level-enabled: true
# Selene не раздаёт resource pack сам. Допустимые значения:
# NONE, Oraxen, ItemsAdder. Выбранный плагин должен быть установлен на этом Paper.
resource-pack-provider: "ItemsAdder"
