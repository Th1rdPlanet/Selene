# Selene / Paper — interactive-captcha.yml
# Используется только при captcha-view: INTERACTIVE.
interactive-captcha:
  # Имя отдельного void-мира. Не используйте здесь selene_limbo или игровой мир.
  world: "selene_interactive"
  # Общее время на испытание; после него действует обычный timeout авторизации.
  timeout-seconds: 120
  # После скольких ошибок перестроить расположение объектов.
  max-mistakes: 2
  # Расстояние между началами приватных арен одного мира.
  arena-spacing: 64
  isolation:
    # Полностью скрывать проходящих CAPTCHA игроков друг от друга.
    hide-players: true
    # Убирать других проходящих CAPTCHA игроков из TAB.
    hide-tab-list: true
    # Не показывать подписи имён над игроками.
    hide-name-tags: true
    # Не публиковать сообщения игрока во время CAPTCHA.
    suppress-chat: true
  display:
    # Крупный title по центру экрана. По умолчанию выключен, чтобы не закрывать арену.
    title: false
    # Короткая инструкция и таймер над хотбаром.
    actionbar: true
    # Задание и оставшееся время в боковой панели.
    scoreboard: true
  platform:
    # Ширина пола в блоках.
    width: 16
    # Длина пола в блоках.
    length: 16
    # SOLID, RANDOM или CHECKERBOARD.
    floor-pattern: "RANDOM"
    # При RANDOM каждый блок пола независимо выбирается из списка.
    floor-materials:
      - STONE
      - ANDESITE
    # Невидимая граница, не позволяющая уйти на соседнюю арену.
    boundary-material: BARRIER
    decoration:
      # Добавлять бордюр, ограждение с проходами и четыре световые стойки.
      enabled: true
      # Материал контрастного бордюра платформы.
      border-material: POLISHED_ANDESITE
      # Материал невысокого ограждения по краям.
      railing-material: STONE_BRICK_WALL
      # Основание угловых световых стоек.
      lamp-base-material: CHISELED_STONE_BRICKS
      # Светящийся блок наверху стойки.
      light-material: SEA_LANTERN
  generation:
    # Максимум попыток подобрать непересекающиеся случайные позиции.
    attempts: 32
    # Минимальный отступ цели от края платформы.
    min-target-distance: 4
    # Число безопасных отвлекающих блоков.
    decoys: 5
  scenarios:
    # weight задаёт относительную частоту сценария; все позиции всегда случайны.
    # target-material и challenge-item используют стандартные имена Bukkit Material.
    break-block: { enabled: true, weight: 10, target-material: COAL_ORE }
    chop-tree: { enabled: true, weight: 8, target-material: OAK_LOG }
    take-from-chest: { enabled: true, weight: 8, target-material: CHEST, challenge-item: EMERALD }
    armor-stand: { enabled: true, weight: 6, target-material: ARMOR_STAND, challenge-item: IRON_CHESTPLATE }
    press-button: { enabled: true, weight: 8, target-material: STONE_BUTTON }
    toggle-lever: { enabled: true, weight: 8, target-material: LEVER }
    stand-on-block: { enabled: true, weight: 10, target-material: GOLD_BLOCK }
    put-in-chest: { enabled: true, weight: 7, target-material: CHEST, challenge-item: EMERALD }
    item-frame: { enabled: true, weight: 6, target-material: ITEM_FRAME, challenge-item: EMERALD }
