# Роль PROXY_AUTH: Paper подключается только к TLS-relay внутри плагина Selene на Velocity.
# Rust backend здесь не указывается: в proxy-схеме с ним общается только Velocity.

# Адрес машины с Velocity. Если Paper и Velocity работают на одной машине — оставь localhost.
# При разных машинах укажи приватный IP/DNS Velocity и закрой порт от внешнего интернета.
host=localhost

# Должен ТОЧНО совпадать с портом relay-bind в plugins/selene/velocity.properties.
# Стандартный relay-bind на Velocity: 127.0.0.1:38291.
port=38291

# PKCS12-файл ЭТОГО Paper auth-сервера: приватный ключ + сертификат + цепочка CA.
# Путь относителен plugins/Selene/. Приватный ключ нельзя копировать на Velocity.
key-store=paper-identity.p12

# ИМЯ переменной окружения, содержащей пароль paper-identity.p12.
# Это не сам пароль. Пример запуска: export SELENE_PAPER_KEY_PASSWORD='сложный-пароль'
key-password-env=SELENE_PAPER_KEY_PASSWORD

# PKCS12 trust store с публичным CA/сертификатом, которому доверен TLS-relay Velocity.
# Путь относителен plugins/Selene/. Приватных ключей Velocity в этом файле быть не должно.
trust-store=proxy-trust.p12

# ИМЯ переменной окружения с паролем proxy-trust.p12, а не сам пароль.
# Пример запуска: export SELENE_PAPER_TRUST_PASSWORD='другой-сложный-пароль'
trust-password-env=SELENE_PAPER_TRUST_PASSWORD
