# Роль STANDALONE: этот Paper подключается прямо к Rust backend.
# Адрес должен совпадать с listen в backend/config.toml.
endpoint=tls://127.0.0.1:38191

# Небезопасный TCP разрешается только для явного tcp:// loopback endpoint.
# Для обычного tls:// всегда оставляй false.
allow-loopback-plaintext=false

# PKCS12-файл Paper: приватный ключ + сертификат + цепочка CA.
# Все пути относительны plugins/Selene/.
key-store=paper-identity.p12

# ИМЯ переменной окружения с паролем key-store, не сам пароль.
key-password-env=SELENE_PAPER_KEY_PASSWORD

# PKCS12 trust store с CA/сертификатом Rust backend.
trust-store=backend-trust.p12

# ИМЯ переменной окружения с паролем trust-store, не сам пароль.
trust-password-env=SELENE_PAPER_TRUST_PASSWORD

# Требовать CAPTCHA при каждом standalone-входе. Допустимо только true или false.
captcha-required=true
