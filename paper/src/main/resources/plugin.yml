name: Selene
version: 0.1.0-dev
main: ru.moonlightproject.dev.selene.paper.SelenePaper
api-version: '1.21'
author: '~VicTim~'
website: https://dev.moonlightproject.ru
softdepend: [packetevents, Oraxen, ItemsAdder]
load: POSTWORLD
commands:
  login:
    aliases: [l]
  register:
    aliases: [reg]
  selene:
    description: Selene administration (console, or signed-in players with selene.command.* permissions)
permissions:
  selene.command.reload:
    description: Reload Selene configuration on this Paper server
    default: op
  selene.command.account.view:
    description: List and inspect Selene accounts
    default: op
  selene.command.account.manage:
    description: Delete accounts and reset passwords or TOTP
    default: op
